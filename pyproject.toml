[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "strict"
testpaths = ["tests"]
markers = ["integration: opt-in tests requiring a real inference server"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
