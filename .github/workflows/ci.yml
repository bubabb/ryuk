name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile
        run: python -m compileall -q backend tests

      - name: Test
        run: python -m pytest -q

      - name: Evaluate routing policy
        run: python -m scripts.evaluate_routing

      - name: Evaluate audit policy
        run: python -m scripts.evaluate_audit

      - name: Lint
        run: ruff check backend tests scripts

      - name: Type check
        run: mypy backend tests scripts
